{% extends "base.html" %}

{% block title %}Sign In - OBLIGRAPH{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center py-5" style="min-height: 75vh;">
  <div class="card-modern p-4 p-md-5 shadow-lg w-100" style="max-width: 460px;">
    <div class="text-center mb-4">
      <div class="brand-icon-box mx-auto mb-3" style="width: 44px; height: 44px; font-size: 1.4rem;">
        <i class="bi bi-diagram-3-fill"></i>
      </div>
      <h2 class="h4 fw-bold mb-1">Sign in to OBLIGRAPH</h2>
      <p class="text-muted small mb-0">Access your isolated contract obligation &amp; compliance workspace</p>
    </div>

    <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if request.args.get('next') %}
      <input type="hidden" name="next" value="{{ request.args.get('next') }}">
      {% endif %}

      <div class="mb-3">
        <label class="form-label small fw-bold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent text-muted"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@company.com" value="{{ email or '' }}" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="remember" value="1" id="rememberCheck">
          <label class="form-check-label small text-muted" for="rememberCheck">
            Keep me signed in
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top border-subtle">
      <span class="text-muted small">Don't have an account yet?</span>
      <a href="{{ url_for('auth.signup') }}" class="small fw-semibold text-primary text-decoration-none ms-1">
        Create free account <i class="bi bi-arrow-right"></i>
      </a>
    </div>
  </div>
</div>
{% endblock %}
